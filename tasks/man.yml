---
- name: Install NGINX
  ansible.builtin.apt:
    name: "{{ nginx_package }}"
    state: present
    update_cache: true

- name: Ensure NGINX is running and enabled
  ansible.builtin.service:
    name: "{{ nginx_service }}"
    state: started
    enabled: true

- name: Deploy index.html
  ansible.builtin.template:
    src: index.html.j2
    dest: "{{ nginx_index_path }}"
    mode: '0644'
  notify: Restart NGINX


  cd/ansible-roles-demo/tasks/main.yml
  
